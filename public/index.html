<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Dungeon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0a0f;
    --stone: #16141d;
    --stone-2: #1f1c29;
    --line: #2e2a3d;
    --ink: #e8e1cf;
    --ink-dim: #9a92a8;
    --ink-faint: #5d566d;
    --torch: #f0a24a;
    --gold: #e7b84b;
    --green: #6fd896;
    --blood: #e0524a;
    --mana: #8f7cff;
    --teal: #5cc8c2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  body { font-family: 'VT323', ui-monospace, monospace; font-size: 20px; display: grid; grid-template-columns: 1fr 400px; grid-template-rows: 52px 1fr; }
  button, select { font-family: 'VT323', monospace; font-size: 18px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); padding: 2px 8px; cursor: pointer; }
  button:hover, select:hover { border-color: var(--torch); }

  /* ---------- en-tête : blasons des sessions ---------- */
  header {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 14px; min-width: 0;
    background: linear-gradient(var(--stone-2), var(--stone)); border-bottom: 2px solid var(--line);
  }
  header h1 { font-family: 'Press Start 2P', monospace; font-size: 12px; margin: 0; color: var(--torch); letter-spacing: 1px; text-shadow: 0 0 10px rgba(240,162,74,.45); white-space: nowrap; }
  #tabs { flex: 1; min-width: 0; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  .tab {
    display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; padding: 3px 10px 3px 8px;
    border: 1px solid var(--line); background: rgba(11,10,15,.6); color: var(--ink-dim); font-size: 18px;
  }
  .tab.on { color: var(--ink); border-color: var(--torch); background: rgba(240,162,74,.08); box-shadow: inset 0 -2px 0 var(--torch); }
  .tab .prog { color: var(--gold); font-size: 16px; }
  .tab .allies { color: var(--teal); font-size: 16px; }
  .tab .badge { background: var(--blood); color: #fff; padding: 0 5px; font-size: 15px; }
  .dot { width: 9px; height: 9px; display: inline-block; flex: none; background: var(--ink-faint); }
  .st-working .dot, .dot.st-working { background: var(--torch); box-shadow: 0 0 8px var(--torch); animation: flicker 1.3s infinite; }
  .st-permission .dot, .dot.st-permission { background: var(--blood); box-shadow: 0 0 8px var(--blood); animation: blink .8s infinite; }
  .st-input .dot, .dot.st-input { background: var(--gold); box-shadow: 0 0 6px var(--gold); }
  .st-done .dot, .dot.st-done { background: var(--green); }
  .st-sleep .dot, .dot.st-sleep, .st-ended .dot, .dot.st-ended { background: #3a3450; }
  .tab.st-permission { border-color: var(--blood); color: #ffd9d4; }
  @keyframes flicker { 0%,100% { opacity: 1; } 40% { opacity: .55; } 60% { opacity: .9; } }
  @keyframes blink { 50% { opacity: .25; } }
  .ctl { display: flex; align-items: center; gap: 8px; color: var(--ink-dim); font-size: 17px; white-space: nowrap; }
  .live { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-dim); font-size: 17px; }
  .live i { width: 9px; height: 9px; border-radius: 50%; background: var(--blood); display: inline-block; }
  .live.on i { background: var(--green); box-shadow: 0 0 8px var(--green); }

  /* ---------- carte ---------- */
  main { position: relative; overflow: hidden; min-width: 0; }
  canvas#map { display: block; width: 100%; height: 100%; image-rendering: pixelated; cursor: grab; }
  canvas#map.drag { cursor: grabbing; }

  .narration {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: min(760px, calc(100% - 300px));
    background: rgba(11,10,15,.88); border: 2px solid var(--line); border-left: 0; border-right: 0; padding: 7px 14px 8px; pointer-events: none;
    display: none;
  }
  .narration.show { display: block; }
  .narration .who { font-family: 'Press Start 2P', monospace; font-size: 9px; color: var(--torch); letter-spacing: 1px; }
  .narration .who time { color: var(--ink-faint); font-family: 'VT323', monospace; font-size: 15px; margin-left: 8px; letter-spacing: 0; }
  .narration p { margin: 3px 0 0; font-size: 21px; line-height: 1.1; color: #f1ead8; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

  .hud {
    position: absolute; top: 12px; left: 12px; padding: 10px 12px; width: 230px;
    background: rgba(11,10,15,.82); border: 2px solid var(--line); pointer-events: none;
  }
  .hud .lvl { font-family: 'Press Start 2P', monospace; font-size: 11px; color: var(--gold); margin-bottom: 8px; }
  .bar { position: relative; height: 12px; background: #000; border: 1px solid var(--line); margin: 4px 0 8px; }
  .bar > span { position: absolute; inset: 0 auto 0 0; transition: width .35s; }
  .bar.hp > span { background: linear-gradient(90deg, #a5302a, var(--blood)); }
  .bar.xp > span { background: linear-gradient(90deg, #5a49c9, var(--mana)); }
  .hud .row { display: flex; justify-content: space-between; font-size: 18px; color: var(--ink-dim); }
  .hud .row b { color: var(--ink); font-weight: normal; }
  .hud .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; margin-top: 4px; font-size: 18px; color: var(--ink-dim); }
  .hud .stats b { color: var(--ink); font-weight: normal; }

  .mapctl { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .mapctl button { width: 34px; height: 30px; padding: 0; background: rgba(11,10,15,.85); }
  .mapctl button.on { border-color: var(--torch); }

  .banner {
    position: absolute; left: 50%; top: 24%; transform: translateX(-50%) scale(.9); opacity: 0;
    font-family: 'Press Start 2P', monospace; font-size: 20px; color: var(--gold); text-align: center;
    text-shadow: 0 0 16px rgba(231,184,75,.6), 3px 3px 0 #000; transition: all .4s; pointer-events: none; white-space: nowrap;
  }
  .banner.show { opacity: 1; transform: translateX(-50%) scale(1); }
  .banner small { display: block; font-family: 'VT323', monospace; font-size: 22px; color: var(--ink); margin-top: 8px; text-shadow: 2px 2px 0 #000; }

  .waiting {
    position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
    background: rgba(40,10,10,.92); border: 2px solid var(--blood); color: #ffd9d4; padding: 8px 16px;
    display: none; max-width: 80%; text-align: center; animation: pulse 1.1s infinite;
  }
  .waiting.input { background: rgba(40,28,8,.92); border-color: var(--gold); color: #ffe9b8; animation: none; }
  .waiting.show { display: block; }
  main.alert { box-shadow: inset 0 0 0 3px var(--blood); animation: border 1.1s infinite; }
  @keyframes pulse { 50% { border-color: #ff8c84; box-shadow: 0 0 18px rgba(224,82,74,.6); } }
  @keyframes border { 50% { box-shadow: inset 0 0 40px 3px rgba(224,82,74,.55); } }

  .tip {
    position: absolute; pointer-events: none; display: none; max-width: 360px; z-index: 5;
    background: rgba(11,10,15,.95); border: 1px solid var(--line); padding: 5px 9px; font-size: 18px; line-height: 1.1;
  }
  .tip b { color: var(--torch); font-weight: normal; }
  .tip .dim { color: var(--ink-dim); }

  .empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--ink-dim); pointer-events: none; }
  .empty h2 { font-family: 'Press Start 2P', monospace; font-size: 14px; color: var(--torch); line-height: 1.8; }

  /* ---------- royaume : une carte par projet ---------- */
  .realm { position: absolute; inset: 0; overflow-y: auto; padding: 22px 26px 40px; display: none;
    background: radial-gradient(ellipse at 50% 0%, #1a1724 0%, var(--bg) 70%); }
  .realm.show { display: block; }
  .realm > h2 { font-family: 'Press Start 2P', monospace; font-size: 13px; color: var(--torch); margin: 0 0 4px; letter-spacing: 1px; }
  .realm > p { margin: 0 0 18px; color: var(--ink-dim); }
  .castles { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 18px; }
  .castle { background: var(--stone); border: 2px solid var(--line); position: relative; }
  .castle.st-permission { border-color: var(--blood); animation: pulse 1.1s infinite; }
  .castle.st-working { border-color: #4a3a2a; }
  .castle > header { all: unset; display: flex; gap: 12px; align-items: center; padding: 10px 12px 8px; border-bottom: 1px solid var(--line); }
  .castle canvas { width: 72px; height: 60px; image-rendering: pixelated; flex: none; }
  .castle h3 { font-family: 'Press Start 2P', monospace; font-size: 11px; margin: 0 0 6px; color: var(--ink); word-break: break-all; }
  .castle .path { color: var(--ink-faint); font-size: 16px; word-break: break-all; }
  .hero-row { display: block; width: 100%; text-align: left; border: 0; border-top: 1px dashed rgba(46,42,61,.8); background: none; padding: 9px 12px 10px; font-size: 19px; }
  .hero-row:first-of-type { border-top: 0; }
  .hero-row:hover { background: rgba(240,162,74,.06); }
  .hero-row .top { display: flex; align-items: center; gap: 8px; color: var(--ink-dim); font-size: 17px; }
  .hero-row .top .state { color: var(--ink); }
  .hero-row .top .ago { margin-left: auto; color: var(--ink-faint); }
  .hero-row .forget { color: var(--ink-faint); padding: 0 4px; visibility: hidden; }
  .hero-row:hover .forget { visibility: visible; }
  .hero-row .forget:hover { color: var(--blood); }
  .hero-row .q { margin: 4px 0 2px; color: var(--torch); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .hero-row .n { color: #d8d2c0; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hero-row .obj { margin-top: 6px; display: flex; align-items: center; gap: 8px; font-size: 17px; color: var(--ink-dim); }
  .hero-row .obj .bar { flex: 0 0 90px; height: 8px; margin: 0; }
  .hero-row .obj .bar > span { background: linear-gradient(90deg, #8a6a1e, var(--gold)); }
  .hero-row .obj .cur { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hero-row .meta { margin-top: 4px; font-size: 16px; color: var(--ink-faint); }

  /* ---------- panneau de droite ---------- */
  aside { border-left: 2px solid var(--line); background: var(--stone); display: flex; flex-direction: column; min-height: 0; }
  aside h2 { font-family: 'Press Start 2P', monospace; font-size: 10px; color: var(--ink-dim); margin: 0; letter-spacing: 1px; }
  .questbox { padding: 12px 14px 10px; border-bottom: 2px solid var(--line); max-height: 48%; overflow-y: auto; flex: none; }
  .questbox .q { margin: 6px 0 12px; color: var(--torch); line-height: 1.1; cursor: pointer; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; }
  .questbox .q.full { -webkit-line-clamp: unset; }
  .questbox .q.none { color: var(--ink-faint); cursor: default; }
  .questbox h2 .count { color: var(--gold); margin-left: 6px; }
  #objectives { list-style: none; margin: 6px 0 0; padding: 0; }
  #objectives li { display: flex; gap: 8px; padding: 3px 0; line-height: 1.05; color: var(--ink-dim); }
  #objectives li .ic { flex: none; width: 20px; text-align: center; }
  #objectives li.in_progress { color: var(--torch); }
  #objectives li.in_progress .ic { animation: flicker 1.3s infinite; }
  #objectives li.completed { color: #6f8a74; text-decoration: line-through; text-decoration-color: rgba(111,216,150,.5); }
  #objectives li.completed .ic { color: var(--green); text-decoration: none; }
  #objectives .none { color: var(--ink-faint); }

  .chronhead { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex: none; }
  .chronhead h2 { flex: 1; }
  .chronhead button { font-size: 16px; padding: 1px 7px; }
  .seg { display: inline-flex; }
  .seg button + button { border-left: 0; }
  .seg button.on { color: var(--bg); background: var(--torch); border-color: var(--torch); }

  #log { flex: 1; overflow-y: auto; padding: 6px 12px 16px; font-size: 19px; line-height: 1.12; }
  #log::-webkit-scrollbar, .questbox::-webkit-scrollbar, .realm::-webkit-scrollbar { width: 8px; }
  #log::-webkit-scrollbar-thumb, .questbox::-webkit-scrollbar-thumb, .realm::-webkit-scrollbar-thumb { background: var(--line); }
  .entry { padding: 5px 0; border-bottom: 1px dashed rgba(46,42,61,.6); word-break: break-word; }
  .entry.hidden { display: none; }
  .entry time { color: var(--ink-faint); font-size: 15px; margin-right: 6px; }
  .entry .tag { font-size: 15px; color: var(--bg); background: var(--ink-dim); padding: 0 4px; margin-right: 5px; }
  .entry .sub { display: block; color: var(--ink-dim); font-size: 17px; margin-left: 2px; }
  .entry .body { display: block; margin-top: 2px; white-space: pre-wrap; }
  .entry.minor { color: var(--ink-dim); }
  .entry.prompt { color: var(--torch); border-left: 3px solid var(--torch); padding-left: 8px; margin: 6px 0; }
  .entry.prompt .body { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
  .entry.say { color: #d8d2c0; font-style: italic; border-left: 3px solid #555068; padding-left: 8px; }
  .entry.say .body { display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
  .entry.chronicle { color: #f1e3b8; border: 1px solid #5a4a22; background: rgba(231,184,75,.06); padding: 6px 8px; margin: 6px 0; }
  .entry.err > details > summary, .entry.err > .head { color: #ff9a92; }
  .entry.stop { color: var(--green); }
  .entry.wait { color: #ffd9d4; }
  .entry.wait.input { color: #ffe9b8; }
  .entry.objective, .entry.objectives { color: var(--gold); }
  .entry.companion { color: #9fd6d2; }
  .entry.open .live-dot { display: inline-block; width: 7px; height: 7px; background: var(--torch); margin-left: 6px; vertical-align: middle; animation: flicker 1s infinite; }
  .entry details > summary { cursor: pointer; list-style: none; }
  .entry details > summary::-webkit-details-marker { display: none; }
  .entry details > summary::before { content: '▸'; color: var(--ink-faint); margin-right: 5px; }
  .entry details[open] > summary::before { content: '▾'; }
  .entry ul { list-style: none; margin: 4px 0 2px 14px; padding: 0 0 0 8px; border-left: 1px solid var(--line); font-size: 17px; color: var(--ink-dim); }
  .entry ul li { padding: 1px 0; }
  .entry ul li.err { color: #ff9a92; }
  .entry ul li code { color: #c9b8ff; }
  .entry ul li .why { display: block; color: #c98a85; font-size: 15px; margin-left: 20px; }
  .entry code { color: #c9b8ff; background: rgba(143,124,255,.1); padding: 0 3px; }
  .muted-note { color: var(--ink-faint); text-align: center; padding: 10px 0; font-size: 17px; }

  @media (max-width: 960px) {
    body { grid-template-columns: 1fr; grid-template-rows: 52px 1fr 42%; }
    aside { border-left: 0; border-top: 2px solid var(--line); }
    .narration { width: calc(100% - 32px); top: auto; bottom: 64px; }
    .hud { display: none; }
    header h1 { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>⚔ CLAUDE DUNGEON</h1>
  <nav id="tabs"></nav>
  <label class="ctl" title="Durée minimale d'un déplacement du héros">Rythme
    <select id="speed">
      <option value="calm">calme</option>
      <option value="normal">normal</option>
      <option value="fast">rapide</option>
    </select>
  </label>
  <span class="live" id="live"><i></i>live</span>
</header>

<main id="stage">
  <canvas id="map"></canvas>
  <div class="narration" id="narration"><div class="who">💬 CE QUE FAIT LE HÉROS<time id="narrationAge"></time></div><p id="narrationText"></p></div>
  <div class="hud" id="hud">
    <div class="lvl" id="lvl">NIVEAU 1</div>
    <div class="row"><span>PV</span><b id="hpTxt">100/100</b></div>
    <div class="bar hp"><span id="hpBar" style="width:100%"></span></div>
    <div class="row"><span>XP</span><b id="xpTxt">0</b></div>
    <div class="bar xp"><span id="xpBar" style="width:0%"></span></div>
    <div class="stats">
      <span>Salles <b id="sRooms">0</b></span><span>Forges <b id="sForge">0</b></span>
      <span>Sorts <b id="sSpells">0</b></span><span>Échecs <b id="sErr">0</b></span>
      <span>Objectifs <b id="sObj">0</b></span><span>Alliés <b id="sAllies">0</b></span>
    </div>
  </div>
  <div class="mapctl" id="mapctl">
    <button id="follow" title="Suivre le héros">🎯</button>
    <button id="overview" title="Vue d'ensemble du donjon">🗺</button>
  </div>
  <div class="banner" id="banner"></div>
  <div class="waiting" id="waiting"></div>
  <div class="realm" id="realm"></div>
  <div class="tip" id="tip"></div>
  <div class="empty" id="empty"><div><h2>LE ROYAUME EST VIDE</h2>Lance une session Claude Code,<br>son héros apparaîtra ici.</div></div>
</main>

<aside>
  <section class="questbox" id="questbox">
    <h2>📜 QUÊTE</h2>
    <p class="q none" id="questText">Aucune quête en cours.</p>
    <h2>🎯 OBJECTIFS<span class="count" id="objCount"></span></h2>
    <ol id="objectives"></ol>
  </section>
  <div class="chronhead">
    <h2 id="logTitle">📖 CHRONIQUE</h2>
    <span class="seg"><button id="fImp" title="Prompts, objectifs, messages, forges, échecs, permissions, fins de quête">Important</button><button id="fAll" title="Toutes les phases, y compris lectures et recherches">Tout</button></span>
    <button id="replay" title="Rejouer la session au rythme choisi">▶ Rejouer</button>
  </div>
  <div id="log"></div>
</aside>

<script src="model.js"></script>
<script src="app.js"></script>
</body>
</html>
